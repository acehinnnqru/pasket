name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify the selected Xcode
        run: |
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          if [[ "${xcode_version%%$'\n'*}" != "Xcode 27.1" ]]; then
            echo '::error::Xcode 27.1 is required. Select it on the runner with xcode-select.' >&2
            exit 1
          fi
          xcrun swift --version

      - name: Check release tooling
        run: |
          python3 -B .github/scripts/test_version.py
          python3 -B .github/scripts/test_testflight.py
          python3 -B .github/scripts/test_signing_keychain.py
          bash -n .github/scripts/release-macos.sh
          bash -n .github/scripts/upload-testflight.sh
          bash -n .github/scripts/signing-keychain.sh

      - name: Run core tests
        run: xcrun swift test

      - name: Compile the complete app without signing
        run: |
          xcodebuild -project pasket.xcodeproj -scheme pasket -configuration Debug \
            -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO build
