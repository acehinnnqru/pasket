name: Release macOS app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build or retry
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate the release commit
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag
        id: tag
        run: |
          trap 'echo "::error::Release tag validation failed (configuration)"' ERR
          python3 .github/scripts/version.py check "$RELEASE_TAG" >/dev/null 2>&1
          commit="$(git rev-parse --verify HEAD)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          echo 'Release tag validation succeeded.'

      - name: Check version tooling
        run: |
          trap 'echo "::error::Version tooling checks failed (tests)"' ERR
          python3 -B .github/scripts/test_version.py >/dev/null 2>&1
          echo 'Version tooling checks succeeded.'

      - name: Verify the selected Xcode
        run: |
          trap 'echo "::error::Toolchain validation failed (toolchain)"' ERR
          xcode_version="$(xcodebuild -version 2>/dev/null)"
          [[ "${xcode_version%%$'\n'*}" == "Xcode 27.1" ]]
          xcrun swift --version >/dev/null 2>&1
          echo 'Toolchain validation succeeded.'

      - name: Run core tests
        run: |
          trap 'echo "::error::Core tests failed (tests)"' ERR
          xcrun swift test >/dev/null 2>&1
          echo 'Core tests succeeded.'

  release:
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tested commit
        env:
          VERIFIED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          commit="$(git rev-parse --verify HEAD)"
          if [[ "$commit" != "$VERIFIED_COMMIT" ]]; then
            echo '::error::The release tag no longer points to the tested commit.'
            exit 1
          fi

      - name: Verify the selected Xcode
        run: |
          trap 'echo "::error::Toolchain validation failed (toolchain)"' ERR
          xcode_version="$(xcodebuild -version 2>/dev/null)"
          [[ "${xcode_version%%$'\n'*}" == "Xcode 27.1" ]]
          echo 'Toolchain validation succeeded.'

      - name: Build, sign, notarize, and package
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          echo 'Release distribution started.'
          # Older tags can still write raw diagnostics and workflow command files.
          if GITHUB_OUTPUT=/dev/null GITHUB_STEP_SUMMARY=/dev/null GITHUB_ENV=/dev/null \
              GITHUB_PATH=/dev/null GITHUB_STATE=/dev/null \
              bash .github/scripts/release-macos.sh 2>&1 |
              awk -v stages='preflight|signing|build|verification|app-notarization|packaging|dmg-notarization|zip-verification|cleanup' \
                  -v errors='configuration|signing|identity|build|verification|packaging|notarization-request|notarization-result|stapling|cleanup' \
                  '$0 ~ ("^Distribution (" stages "): (started|succeeded|failed [(](" errors ")[)])$") { print; fflush() }'; then
            echo 'Release distribution succeeded.'
          else
            status=$?
            echo '::error::Release distribution failed (distribution)'
            exit "$status"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          trap 'echo "::error::GitHub publication failed ($category)"' ERR
          category=release-state
          asset_directory="$RUNNER_TEMP/pasket-assets"
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi

          # Resume an interrupted upload only while the release is still a draft.
          if gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null > "$RUNNER_TEMP/pasket-release.json"; then
            is_draft="$(plutil -extract isDraft raw -o - "$RUNNER_TEMP/pasket-release.json" 2>/dev/null)"
            if [[ "$is_draft" != true ]]; then
              echo '::error::GitHub publication failed (already-published)'
              exit 1
            fi
          else
            category=release-create
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "Pasket $RELEASE_TAG" "${release_flags[@]}" >/dev/null 2>&1
          fi

          category=asset-upload
          gh release upload "$RELEASE_TAG" \
            "$asset_directory/pasket-$RELEASE_TAG-universal.zip" \
            "$asset_directory/pasket-$RELEASE_TAG-universal.dmg" --clobber >/dev/null 2>&1
          category=release-publish
          gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}" >/dev/null 2>&1
          echo 'GitHub publication succeeded.'

  testflight:
    needs: validate
    uses: ./.github/workflows/testflight.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      verified_commit: ${{ needs.validate.outputs.commit }}
    secrets: inherit
